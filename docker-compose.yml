services:
  postgres:
    image: postgres:16-alpine
    container_name: incatour_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: incatour_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Atrapa los mails que manda el back y los muestra en http://localhost:8025 (no envía nada a internet)
  mailpit:
    image: axllent/mailpit:v1.20.5
    container_name: incatour_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: